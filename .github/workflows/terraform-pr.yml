name: Terraform PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CHECKPOINT_DISABLE: "1"
  TF_VERSION: "1.17.2" # keep in step with .terraform-version

jobs:
  checks:
    name: Format, validate, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate and test (offline, mocked provider)
        run: |
          for dir in bootstrap org modules/otel-pipeline; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false
            terraform -chdir=$dir validate
            terraform -chdir=$dir test
            echo "::endgroup::"
          done

      - name: OpenTelemetry Collector config validation
        env:
          OTELCOL_VERSION: "0.165.0" # keep close to collector_image in modules/otel-pipeline
        run: modules/otel-pipeline/tests/validate-configs.sh

      - name: Kill switch unit tests
        run: |
          python -m pip install --quiet functions-framework pytest
          python -m pytest -q modules/kill-switch/function

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Checkov policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          directory: .

  plan:
    name: Plan (org)
    needs: checks
    # Skipped until bootstrap has run and the repository variables exist, and
    # never run for forks (they cannot get an OIDC token anyway).
    if: vars.GCP_WIF_PROVIDER != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_seed_project_id: ${{ vars.GCP_SEED_PROJECT }}
      TF_VAR_project_prefix: ${{ vars.GCP_PROJECT_PREFIX }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_directory_customer_id: ${{ vars.GCP_DIRECTORY_CUSTOMER_ID }}
      TF_VAR_groups: ${{ vars.GCP_GROUPS || '{}' }}
      TF_VAR_kill_switch_dry_run: ${{ vars.KILL_SWITCH_DRY_RUN || 'true' }}
      TF_VAR_currency_code: ${{ vars.GCP_BILLING_CURRENCY || 'GBP' }}
      TF_VAR_otel: ${{ vars.OTEL_SETTINGS || '{}' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=org init -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"

      - name: terraform plan
        id: plan
        # Read-only account: no state lock.
        run: |
          set +e
          terraform -chdir=org plan -lock=false -no-color -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [ $code -eq 0 ]; then terraform -chdir=org show -no-color tfplan > plan.txt; else cp plan.log plan.txt; fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:org -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^Plan: .*$/m) || plan.match(/^No changes\..*$/m) || ['Plan failed, see log'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see the workflow log';
            const ok = process.env.PLAN_EXIT === '0';
            const body = `${marker}\n### Terraform plan: \`org\` ${ok ? '✅' : '❌'}\n**${summary}**\n\n<details><summary>Full plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n_Run ${context.runId} · ${context.sha.slice(0, 7)}_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
