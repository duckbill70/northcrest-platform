# Edge collector: public OTLP/HTTP endpoint on Cloud Run for telemetry from
# outside Google Cloud, mainly browser real-user monitoring (the React apps)
# and Playwright synthetic users. It trusts nothing it receives:
#   - CORS limits which sites can send from a browser
#   - requests are capped at 1 MiB and instances at edge_max_instances
#   - anything not from a northcrest-* service is dropped
#   - the only metrics accepted are the browser Core Web Vitals
#   - client addresses are removed before the data goes anywhere
# Then it publishes to Pub/Sub for the gateway, which applies the rest of
# the policy.
#
# It is stateless on purpose. Cloud Run (request-based billing) only gives
# the container CPU while a request is in flight, so there is no batch
# processor and no sending queue: each incoming request is published before
# the response is sent. Browser SDKs batch already.
#
# Environment: OTEL_PROJECT_ID, OTEL_CORS_ORIGINS (a YAML/JSON list).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        cors:
          allowed_origins: ${env:OTEL_CORS_ORIGINS}
          max_age: 7200

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 360
    spike_limit_mib: 90

  filter/foreign:
    error_mode: ignore
    traces:
      span:
        - not IsMatch(resource.attributes["service.name"], "^northcrest-")
    metrics:
      metric:
        - not IsMatch(resource.attributes["service.name"], "^northcrest-")
    logs:
      log_record:
        - not IsMatch(resource.attributes["service.name"], "^northcrest-")

  # The only metrics a browser may send are the Core Web Vitals. Everything
  # else (including other northcrest.* names) is dropped here, so a public
  # sender cannot create new metric series.
  filter/web_vitals_only:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^northcrest\\.web\\.(lcp|inp|cls)$")'

  transform/scrub:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - delete_key(attributes, "client.address")
      - context: span
        statements:
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "network.peer.address")
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "client.address")
      - context: datapoint
        statements:
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "network.peer.address")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "network.peer.address")

  resource/edge:
    attributes:
      - key: northcrest.ingest
        value: edge
        action: upsert
      - key: northcrest.business_unit
        value: customer-channels
        action: insert
      - key: northcrest.tier
        value: commercial
        action: insert

exporters:
  googlecloudpubsub/traces:
    project: ${env:OTEL_PROJECT_ID}
    topic: projects/${env:OTEL_PROJECT_ID}/topics/otel-traces
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: false
  googlecloudpubsub/metrics:
    project: ${env:OTEL_PROJECT_ID}
    topic: projects/${env:OTEL_PROJECT_ID}/topics/otel-metrics
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: false
  googlecloudpubsub/logs:
    project: ${env:OTEL_PROJECT_ID}
    topic: projects/${env:OTEL_PROJECT_ID}/topics/otel-logs
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/foreign, transform/scrub, resource/edge]
      exporters: [googlecloudpubsub/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/foreign, filter/web_vitals_only, transform/scrub, resource/edge]
      exporters: [googlecloudpubsub/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/foreign, transform/scrub, resource/edge]
      exporters: [googlecloudpubsub/logs]
